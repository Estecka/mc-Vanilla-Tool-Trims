name: build
on:
  - pull_request
  - workflow_call
  - workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup FFmpeg action
        uses: AnimMouse/setup-ffmpeg@v1.2.5
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Make executable
        run: chmod +x ./*.sh sh/*.sh
      - name: Build
        run: ./build.sh --minify
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./*.zip
